[package]
name = "tocsin"
description = "Send one notification to many services from a single URL. Reads Apprise notification URLs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["notification", "apprise", "alert", "telegram", "discord"]
categories = ["network-programming", "web-programming::http-client"]
readme = "README.md"
include = ["src/**/*", "examples/**/*", "compat/timezones.txt", "README.md", "LICENSE-*"]

[features]
default = ["all-services", "ureq"]
# Every service tocsin supports.
all-services = [
    "telegram", "discord", "ntfy", "gotify", "json", "form", "workflows",
    "mattermost", "rocketchat", "pushover", "slack", "prowl",
]
# A blocking HTTP transport.
ureq = ["dep:ureq"]
# `TryFrom<&PreparedRequest>` for `http::Request<Vec<u8>>`, for async clients.
http = ["dep:http"]
# Test-only: exposes the parsed fields so they can be compared with Apprise.
compat = []

# The services. Each lists the shared helpers it uses, which are the internal
# features below; a helper is compiled only when a service that uses it is on.
telegram = ["_services", "_sequence", "_lookups", "_multipart", "dep:regex", "_list", "_flag", "_to_map", "_paths", "_payload", "_any_host", "_format", "_merged"]
discord = ["_services", "_multipart", "dep:regex", "_token", "_list", "_flag", "_raw_optional", "_to_map", "_paths", "_payload", "_any_host", "_parts"]
ntfy = ["_services", "dep:regex", "dep:base64", "_pairs", "_verify", "_list", "_flag", "_raw_optional", "_paths", "_optional_host", "_parts"]
gotify = ["_services", "_token", "_verify", "_paths", "_parts"]
json = ["_services", "_webhook", "_parts"]
form = ["_services", "_webhook", "_multipart", "dep:regex", "_parts"]
workflows = ["_services", "_validate", "_query", "_verify", "_flag", "_to_map", "_paths", "_payload", "_parts"]
mattermost = ["_services", "_sequence", "_lookups", "_multipart", "dep:regex", "_token", "_verify", "_quote", "_list", "_flag", "_paths", "_format", "_merged"]
rocketchat = ["_services", "_sequence", "dep:regex", "_verify", "_query", "_list", "_flag", "_paths", "_format", "_merged"]
pushover = ["_services", "_multipart", "dep:regex", "_token", "_pairs", "_list", "_flag", "_paths", "_any_host", "_format", "_parts"]
prowl = ["_services", "_validate", "_pairs", "_paths", "_any_host", "_parts"]
slack = ["_services", "_sequence", "_lookups", "_multipart", "_validate", "_query", "_list", "_flag", "_to_map", "_paths", "_payload", "_optional_host", "_format", "_parts"]

# Internal features. Set by every service.
_services = []
# Requests that depend on the answer to an earlier one.
_sequence = []
# Looking names up before anything is sent.
_lookups = []
# Apprise's default token validation.
_token = []
# Validation with a service's own regular expression.
_validate = ["dep:regex"]
# Apprise's check that a host name or address is valid.
_verify = ["dep:regex"]
# Encoding a query string value the way Python's `requests` does.
_query = []
# Encoding a path segment the same way.
_quote = []
# `multipart/form-data` bodies, for services that upload files.
_multipart = []
# The same for a list of key and value pairs.
_pairs = ["_query"]
# What the JSON and form webhooks share.
_webhook = ["_pairs", "dep:base64", "_verify", "_payload"]
# Shared helpers of the URL grammar and of message handling.
_list = []
_flag = []
_raw_optional = []
_to_map = []
_paths = []
_payload = []
_any_host = []
_optional_host = []
_format = []
_merged = []
_parts = []

[dependencies]
# `arbitrary_precision` keeps Telegram chat ids of any length exact.
serde_json = { version = "1", features = ["arbitrary_precision"] }
percent-encoding = "2"
regex = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
http = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }

[[example]]
name = "preview"
required-features = ["_services"]

[package.metadata.docs.rs]
features = ["http"]

[lints]
workspace = true
