[package]
name = "tocsin-cli"
description = "The tocsin command line: send a notification to many services from Apprise-style URLs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["notification", "apprise", "cli", "alert"]
categories = ["command-line-utilities"]
readme = "README.md"
include = ["src/**/*", "README.md", "LICENSE-*"]

[[bin]]
name = "tocsin"
path = "src/main.rs"

[dependencies]
tocsin = { path = "../tocsin", version = "0.2.0" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
serde_json = "1"

[lints]
workspace = true
