name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: Damaged URLs never panic
        run: cargo test -p tocsin --all-features --test robustness
        env:
          TOCSIN_FUZZ_ROUNDS: "1000"

  # Every service is an optional feature, and a helper that one service needs
  # is dead code in a build without it. The full powerset is too large, so
  # check each feature alone and every pair.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # The features that start with an underscore are helpers that a service
      # switches on; they are left out of the combinations.
      - name: List the internal features
        run: echo "INTERNAL=$(sed -n 's/^\(_[a-z_]*\) *=.*/\1/p' crates/tocsin/Cargo.toml | paste -sd, -)" >> "$GITHUB_ENV"
      - name: Clippy for every feature combination
        run: >
          cargo hack clippy -p tocsin --all-targets
          --feature-powerset --depth 2
          --exclude-features all-services,compat,${{ env.INTERNAL }}
          -- -D warnings
      - name: Tests for every feature combination
        run: >
          cargo hack test -p tocsin
          --feature-powerset --depth 2
          --exclude-features all-services,compat,${{ env.INTERNAL }}

      - name: Clippy with the compat feature for each service
        run: >
          cargo hack clippy -p tocsin --all-targets
          --features compat --each-feature
          --exclude-features all-services,ureq,${{ env.INTERNAL }}
          -- -D warnings
      - name: Differential tests with each service alone
        run: >
          cargo hack test -p tocsin --test compat
          --features compat --each-feature
          --exclude-features all-services,ureq,${{ env.INTERNAL }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p tocsin -p tocsin-reqwest --no-deps --all-features

  # The expected Apprise answers in crates/tocsin/compat/oracle.json must be
  # exactly what Apprise 81739e9 prints for crates/tocsin/compat/fixtures.json.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: caronc/apprise
          ref: 81739e9a1187f986a09281b5d0c25c806e8152e0
          path: apprise
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests requests-oauthlib PyYAML markdown click certifi cryptography
      - name: Regenerate the oracle
        run: >
          python crates/tocsin/compat/apprise_oracle.py
          --apprise-dir apprise --output "$RUNNER_TEMP/oracle.json"
      - name: Compare with the committed oracle
        run: diff -u crates/tocsin/compat/oracle.json "$RUNNER_TEMP/oracle.json"
