[workspace]
resolver = "3"
members = ["crates/tocsin", "crates/tocsin-cli", "crates/tocsin-reqwest"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["tocsin contributors"]
repository = "https://github.com/zbl1998-sdjn/tocsin"
homepage = "https://github.com/zbl1998-sdjn/tocsin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they help here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
